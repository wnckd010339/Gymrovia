spring.datasource.url=jdbc:h2:mem:gym_management;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
mybatis.mapper-locations=classpath:mappers/**/*.xml
spring.thymeleaf.cache=false
payment.order.expiration-enabled=false
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
attendance.qr.cleanup-enabled=false
attendance.qr.center-code=FITFLOW_TEST
attendance.qr.center-name=FitFlow Test Center
attendance.qr.public-base-url=http://localhost:8080
