<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header">
    <a th:href="@{/admin/dashboard}">
        FitFlow
    </a>
</header>
<aside class="sidebar" th:fragment="adminSidebar(activeMenu)">

    <a class="brand"
       th:href="@{/admin/dashboard}"
       href="/admin/dashboard">
        <span>F</span>
        FitFlow
    </a>

    <p class="workspace-label">관리자</p>

    <nav aria-label="관리자 메뉴">
        <a th:href="@{/admin/dashboard}"
           th:classappend="${activeMenu == 'dashboard'} ? 'active'">
            <svg class="sidebar-nav-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <rect x="3" y="3"
                      width="7" height="7" rx="1" />
                <rect x="14" y="3"
                      width="7" height="7" rx="1" />
                <rect x="3" y="14"
                      width="7" height="7" rx="1" />
                <rect x="14" y="14"
                      width="7" height="7" rx="1" />
            </svg>
            <span>대시보드</span>
        </a>

        <a th:href="@{/admin/members}"
           th:classappend="${activeMenu == 'members'} ? 'active'">
            <svg class="sidebar-nav-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <circle cx="9" cy="8" r="4"/>
                <path d="M3 21v-2a6 6 0 0 1 12 0v2"/>
                <path d="M16 4.5a4 4 0 0 1 0 7"/>
                <path d="M18 15a5 5 0 0 1 3 4.5V21"/>
            </svg>
            <span>회원 관리</span>
        </a>

        <a th:href="@{/admin/memberships}"
           th:classappend="${activeMenu == 'memberships'} ? 'active'">
            <svg class="sidebar-nav-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <rect x="2.5" y="5"
                      width="19" height="14" rx="3"/>
                <path d="M2.5 10h19"/>
                <path d="M7 15h3"/>
            </svg>
            <span>회원권·결제</span>
        </a>

        <a th:href="@{/admin/attendance}"
           th:classappend="${activeMenu == 'attendance'} ? 'active'">
            <svg class="sidebar-nav-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <rect x="3" y="4"
                      width="18" height="17" rx="3"/>
                <path d="M8 2v4M16 2v4M3 9h18"/>
                <path d="m8 15 2.5 2.5L16 12"/>
            </svg>
            <span>출석 관리</span>
        </a>

        <a th:href="@{/admin/statistics}"
           th:classappend="${activeMenu == 'statistics'} ? 'active'">
            <svg class="sidebar-nav-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <path d="M4 20V10"/>
                <path d="M10 20V4"/>
                <path d="M16 20v-7"/>
                <path d="M22 20H2"/>
            </svg>
            <span>운영 통계</span>
        </a>

        <a th:href="@{/admin/reservations}"
           th:classappend="${activeMenu == 'reservations'} ? 'active'">
            <svg class="sidebar-nav-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <rect x="3" y="5"
                      width="18" height="16" rx="3"/>
                <path d="M8 3v4M16 3v4M3 10h18"/>
                <path d="M8 14h2M12 14h2M16 14h1"/>
            </svg>
            <span>상담·PT 예약</span>
        </a>

        <a th:href="@{/admin/trainers}"
           th:classappend="${activeMenu == 'trainers'} ? 'active'">
            <svg class="sidebar-nav-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <circle cx="12" cy="7" r="4"/>
                <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
                <path d="M8 13.5 12 17l4-3.5"/>
            </svg>
            <span>트레이너</span>
        </a>

        <a th:href="@{/admin/facilities}"
           th:classappend="${activeMenu == 'facilities'} ? 'active'">
            <svg class="sidebar-nav-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <path d="M14.5 6.5a4 4 0 0 0-5-5L12 4 9 7 6.5 4.5a4 4 0 0 0 5 5"/>
                <path d="m10.5 8.5-8 8a2.1 2.1 0 0 0 3 3l8-8"/>
                <path d="m15 13 6 6"/>
            </svg>
            <span>시설 관리</span>
        </a>

        <a th:href="@{/admin/notifications}"
           th:classappend="${activeMenu == 'notifications'} ? 'active'">
            <svg class="sidebar-nav-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
                <path d="M10 21h4"/>
            </svg>
            <span>알림</span>

            <b class="sidebar-badge"
               th:if="${notificationHeader != null
                    and notificationHeader.unreadCount > 0}"
               th:text="${notificationHeader.unreadCount}">
                3
            </b>
        </a>
    </nav>

    <div class="sidebar-profile">
        <div class="avatar">관</div>
        <div class="sidebar-profile-copy">
            <strong th:text="${session.LOGIN_USER?.loginId ?: session.LOGIN_USER?.email ?: '관리자'}">관리자</strong>
            <span>관리자 계정</span>
        </div>
        <form class="sidebar-logout-form"
              th:action="@{/logout}"
              action="/logout" method="post">
            <button class="sidebar-logout-button"
                    type="submit" aria-label="관리자 계정 로그아웃">
                로그아웃
            </button>
        </form>
    </div>
</aside>
</body>
</html>
