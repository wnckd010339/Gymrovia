<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>출석 관리 | Gymrovia</title>
    <link rel="stylesheet" th:href="@{/css/layouts/admin.css}" href="/css/layouts/admin.css">
    <link rel="stylesheet" th:href="@{/css/pages/admin/attendance.css}" href="/css/pages/admin/attendance.css">
</head>
<body>
<div class="admin-shell">
    <aside th:replace="~{fragments/layout :: adminSidebar('attendance')}"></aside>
    <main class="content">
        <header class="page-header">
            <div>
                <h1>출석 관리</h1>
                <p>회원의 입·퇴실 현황과 출석 이력을 확인합니다.</p>
            </div>

            <a class="qr-page-link" th:href="@{/admin/attendance/qr}">
                센터 QR 열기
            </a>
        </header>

        <p class="notice" th:if="${message}" th:text="${message}"></p>
        <form class="filter-panel" method="post" th:action="@{/admin/attendance/check-in}">
            <label>회원 번호<input type="number" name="memberId" min="1" required placeholder="입장할 회원 번호"></label>
            <div class="filter-actions">
                <button type="submit">입장 처리</button>
            </div>
        </form>

        <section class="summary-grid">
            <article>
                <span>오늘 입장</span>
                <strong th:text="${summary.checkedInCount}">0</strong>
            </article>
            <article>
                <span>현재 이용 중</span>
                <strong th:text="${summary.currentCount}">0</strong>
            </article>
            <article>
                <span>퇴실 완료</span>
                <strong th:text="${summary.checkedOutCount}">0</strong>
            </article>
            <article>
                <span>미퇴실 확인 필요</span>
                <strong class="warn" th:text="${summary.missingCheckoutCount}">0</strong>
            </article>
        </section>

        <form class="filter-panel" method="get" th:action="@{/admin/attendance}">
            <label>회원 검색
                <input type="search" name="keyword" th:value="${condition.keyword}" placeholder="이름 또는 연락처">
            </label>
            <label>조회 날짜
                <input type="date" name="date" th:value="${condition.searchDate}">
            </label>
            <label>상태
                <select name="status">
                    <option value="">전체</option>
                    <option value="IN_CENTER" th:selected="${condition.status == 'IN_CENTER'}">이용 중</option>
                    <option value="CHECKED_OUT" th:selected="${condition.status == 'CHECKED_OUT'}">퇴실 완료</option>
                </select>
            </label>
            <div class="filter-actions">
                <a th:href="@{/admin/attendance}">초기화</a>
                <button type="submit">조회</button>
            </div>
        </form>

        <section class="table-card">
            <div class="card-title">
                <h2>현재 입장 회원</h2>
                <span th:text="|${#lists.size(currentAttendances)}명|">0명</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>회원</th>
                        <th>연락처</th>
                        <th>회원권</th>
                        <th>입장 시각</th>
                        <th>이용 시간</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${currentAttendances}">
                        <td th:text="${a.memberName}"></td>
                        <td th:text="${a.phone}"></td>
                        <td th:text="${a.membershipName ?: '확인 필요'}"></td>
                        <td th:text="${#temporals.format(a.checkedInAt, 'MM.dd HH:mm')}"></td>
                        <td th:text="|${a.durationMinutes}분|"></td>
                        <td>
                            <form method="post" th:action="@{/admin/attendance/{id}/checkout(id=${a.attendanceId})}">
                                <button class="checkout" type="submit">퇴실 처리</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(currentAttendances)}">
                        <td colspan="6" class="empty">현재 입장한 회원이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="table-card">
            <div class="card-title"><h2>출석 이력</h2></div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>날짜</th>
                        <th>회원</th>
                        <th>회원권</th>
                        <th>입장</th>
                        <th>퇴실</th>
                        <th>상태</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${attendanceHistory}">
                        <td th:text="${a.attendanceDate}"></td>
                        <td th:text="${a.memberName}"></td>
                        <td th:text="${a.membershipName ?: '-'}"></td>
                        <td th:text="${#temporals.format(a.checkedInAt, 'HH:mm')}"></td>
                        <td th:text="${a.checkedOutAt == null ? '-' : #temporals.format(a.checkedOutAt, 'HH:mm')}"></td>
                        <td><span class="status" th:classappend="${a.status == 'IN_CENTER'} ? ' active'"
                                  th:text="${a.status == 'IN_CENTER' ? '이용 중' : '퇴실 완료'}"></span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(attendanceHistory)}">
                        <td colspan="6" class="empty">조회된 출석 기록이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
