<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>시설 및 기구 관리 | Gymrovia</title>
<link rel="stylesheet" th:href="@{/css/layouts/admin.css}" href="/css/layouts/admin.css">
<link rel="stylesheet" th:href="@{/css/pages/admin/facility.css}" href="/css/pages/admin/facility.css">
<link rel="stylesheet" th:href="@{/css/pages/admin/facility-management.css}" href="/css/pages/admin/facility-management.css">
</head><body><div class="admin-shell"><aside th:replace="~{fragments/layout :: adminSidebar('facilities')}"></aside>
<main class="content"><header class="page-header"><div><h1>시설 및 기구 관리</h1><p>기구 상태와 점검·수리 일정을 관리합니다.</p></div><button id="open-equipment-modal" class="primary-button" type="button">+ 기구 등록</button></header>
<p class="notice" th:if="${message}" th:text="${message}"></p><p class="notice notice-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
<section class="summary-grid"><article><span>전체 기구</span><strong th:text="|${summary.totalCount}대|">0대</strong></article><article><span>정상</span><strong th:text="|${summary.availableCount}대|">0대</strong></article><article><span>점검 필요</span><strong class="warn" th:text="|${summary.inspectionCount}대|">0대</strong></article><article><span>수리·사용 제한</span><strong class="danger" th:text="|${summary.repairCount}대|">0대</strong></article></section>
<form class="filter-panel" method="get" th:action="@{/admin/facilities}"><label>기구 검색<input type="search" name="keyword" th:value="${condition.keyword}" placeholder="기구명 또는 관리번호"></label><label>운동 분류<select name="category"><option value="">전체</option><option th:each="c : ${ {'CHEST','BACK','SHOULDER','LEG','ARM','CARDIO','FREE_WEIGHT','MULTI'} }" th:value="${c}" th:text="${c}" th:selected="${condition.category == c}"></option></select></label><label>상태<select name="status"><option value="">전체</option><option value="AVAILABLE" th:selected="${condition.status == 'AVAILABLE'}">정상</option><option value="INSPECTION" th:selected="${condition.status == 'INSPECTION'}">점검 필요</option><option value="REPAIR" th:selected="${condition.status == 'REPAIR'}">수리 중</option><option value="UNAVAILABLE" th:selected="${condition.status == 'UNAVAILABLE'}">사용 제한</option></select></label><div class="actions"><a th:href="@{/admin/facilities}">초기화</a><button>검색</button></div></form>
<section class="table-card"><div class="table-wrap"><table><thead><tr><th>기구</th><th>관리번호</th><th>운동 분류</th><th>위치</th><th>상태</th><th>최근 점검</th><th>다음 점검</th><th>관리</th></tr></thead><tbody><tr th:each="e : ${equipmentList}"><td><strong th:text="${e.name}"></strong></td><td><code th:text="${e.managementCode}"></code></td><td th:text="${e.category}"></td><td th:text="${e.location}"></td><td><span class="status" th:classappend="| status-${e.status.toLowerCase()}|" th:text="${e.status == 'AVAILABLE' ? '정상' : e.status == 'INSPECTION' ? '점검 필요' : e.status == 'REPAIR' ? '수리 중' : '사용 제한'}"></span></td><td th:text="${e.lastMaintenanceDate ?: '-'}"></td><td th:text="${e.nextDueDate ?: '-'}"></td><td><div class="row-actions"><details class="facility-action"><summary>정보 수정</summary><form class="inline-management-form" method="post" th:action="@{/admin/facilities/{id}(id=${e.equipmentId})}"><input name="name" th:value="${e.name}" required maxlength="150" aria-label="기구명"><select name="category" required aria-label="운동 분류"><option th:each="c : ${ {'CHEST','BACK','SHOULDER','LEG','ARM','CARDIO','FREE_WEIGHT','MULTI'} }" th:value="${c}" th:text="${c}" th:selected="${e.category == c}"></option></select><input name="location" th:value="${e.location}" required maxlength="100" aria-label="위치"><select name="status" required aria-label="상태"><option value="AVAILABLE" th:selected="${e.status == 'AVAILABLE'}">정상</option><option value="INSPECTION" th:selected="${e.status == 'INSPECTION'}">점검 필요</option><option value="REPAIR" th:selected="${e.status == 'REPAIR'}">수리 중</option><option value="UNAVAILABLE" th:selected="${e.status == 'UNAVAILABLE'}">사용 제한</option></select><button type="submit">수정 저장</button></form></details><details class="facility-action"><summary>점검 기록</summary><form class="inline-management-form" method="post" th:action="@{/admin/facilities/{id}/maintenance(id=${e.equipmentId})}"><select name="maintenanceType" required><option value="INSPECTION">점검</option><option value="CLEANING">청소</option><option value="REPAIR">수리</option></select><input name="description" required maxlength="1000" placeholder="작업 내용"><input type="date" name="nextDueDate"><select name="resultingStatus" required><option value="AVAILABLE">정상</option><option value="INSPECTION">점검 필요</option><option value="REPAIR">수리 중</option><option value="UNAVAILABLE">사용 제한</option></select><button type="submit">기록 저장</button></form></details></div></td></tr><tr th:if="${#lists.isEmpty(equipmentList)}"><td class="empty" colspan="8">조회된 기구가 없습니다.</td></tr></tbody></table></div></section>
</main></div>
<dialog id="equipment-modal" th:attr="data-open=${openRegistration}"><form class="modal-form" method="post" th:action="@{/admin/facilities}" th:object="${registration}"><div class="modal-header"><div><h2>기구 등록</h2><p>분류에 따라 관리번호가 자동 생성됩니다.</p></div><button id="close-equipment-modal" type="button" aria-label="닫기">×</button></div><label>기구명<input th:field="*{name}" placeholder="예: 체스트 프레스 01"></label><p class="error" th:errors="*{name}"></p><label>운동 분류<select th:field="*{category}"><option value="">선택</option><option value="CHEST">가슴 · CH</option><option value="BACK">등 · BA</option><option value="SHOULDER">어깨 · SH</option><option value="LEG">하체 · LG</option><option value="ARM">팔 · AR</option><option value="CARDIO">유산소 · CA</option><option value="FREE_WEIGHT">프리웨이트 · FW</option><option value="MULTI">다목적 · MU</option></select></label><p class="error" th:errors="*{category}"></p><label>설치 위치<input th:field="*{location}" placeholder="예: 1층 머신 존"></label><p class="error" th:errors="*{location}"></p><label>구매일<input type="date" th:field="*{purchasedAt}"></label><div class="modal-actions"><button id="cancel-equipment-modal" type="button">취소</button><button class="primary-button" type="submit">등록</button></div></form></dialog>
<script th:src="@{/js/screens/admin-facility.js}" src="/js/screens/admin-facility.js"></script></body></html>
