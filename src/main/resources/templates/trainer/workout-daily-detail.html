<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/layouts/trainer.css}"><link rel="stylesheet" th:href="@{/css/layouts/trainer-sidebar.css}"><title>일일 운동 상세 | Gymrovia</title></head><body>
<header th:replace="~{trainer/fragments :: sidebar('workouts', ${headerProfile})}"></header>
<main class="portal-main"><a class="back-link" href="/trainer/workouts">← 운동 기록</a><div class="page-heading"><div><p class="eyebrow">DAILY WORKOUT</p><h1 th:text="|${memberName} · ${#temporals.format(workoutDate,'yyyy.MM.dd')}|">회원 일일 운동</h1><p>해당 날짜에 진행한 모든 운동과 수행 내용을 확인합니다.</p></div><form method="post" th:action="@{/trainer/workouts/daily/delete(memberId=${workouts[0].memberId},date=${workoutDate})}" data-confirm="이 날짜의 운동 기록을 모두 삭제하시겠습니까?"><button class="danger-button" type="submit">이 날짜 기록 삭제</button></form></div>
<section class="card"><div class="daily-summary"><span th:text="|총 ${exerciseCount}종목|">총 2종목</span><span th:text="|총 ${totalSets}세트|">총 7세트</span></div><div class="daily-exercise-list">
<article class="daily-exercise-card" th:each="workout,stat:${workouts}"><div class="daily-exercise-number" th:text="${stat.index+1}">1</div><div><h3 th:text="${workout.exerciseName}">벤치 프레스</h3><div class="daily-exercise-meta"><span th:text="|${workout.sets}세트|"></span><span th:text="${workout.weight==null?'-':workout.weight+'kg'}"></span><span th:text="${workout.reps==null?'-':workout.reps+'회'}"></span><span th:text="${#temporals.format(workout.startedAt,'HH:mm')}"></span><span th:if="${workout.memo!=null}" th:text="${workout.memo}"></span></div></div><a class="action-button action-button--secondary" th:href="@{/trainer/workouts/{id}/edit(id=${workout.sessionId})}">수정</a></article>
</div></section></main></body></html>
