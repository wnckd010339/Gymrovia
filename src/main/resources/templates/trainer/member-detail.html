<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/layouts/trainer.css}">
    <link rel="stylesheet" th:href="@{/css/layouts/trainer-sidebar.css}">
    <title>회원 상세 | Gymrovia</title>
</head>
<body>
<header th:replace="~{trainer/fragments :: sidebar('members', ${headerProfile})}"></header>
<main class="portal-main">
    <a class="back-link" href="/trainer/members">← 담당 회원</a>
    <div class="page-heading">
        <div><p class="eyebrow">MEMBER DETAIL</p><h1 th:text="${member.name}">회원</h1><p>회원권·출석·운동 현황입니다.</p></div>
    </div>
    <section class="card">
        <div class="detail-grid">
            <div><span>연락처</span><strong th:text="${member.phone}"></strong></div>
            <div><span>이메일</span><strong th:text="${member.email}"></strong></div>
            <div><span>활성 회원권</span><strong th:text="${member.activeMembership}"></strong></div>
            <div><span>PT 잔여 횟수</span><strong th:text="${member.remainingPtSessions + '회'}"></strong></div>
        </div>
        <h2 class="section-title">최근 출석</h2>
        <ul class="activity-list">
            <li th:each="attendance:${attendances}"
                th:text="${#temporals.format(attendance.checkedInAt,'yyyy.MM.dd HH:mm') + ' 체크인'}"></li>
            <li th:if="${#lists.isEmpty(attendances)}">출석 기록이 없습니다.</li>
        </ul>
        <h2 class="section-title">최근 운동</h2>
        <div class="member-workout-days">
            <div class="member-workout-day" th:each="day:${workoutDays}">
                <div>
                    <strong th:text="${#temporals.format(day.workoutDate,'yyyy.MM.dd')}">2026.08.13</strong>
                    <span th:text="${day.workoutSummary + ' · ' + day.exerciseCount + '종목 · ' + day.totalSets + '세트'}">가슴 + 삼두 · 4종목</span>
                </div>
                <a class="action-button action-button--secondary"
                   th:href="@{/trainer/workouts/daily(memberId=${day.memberId},date=${day.workoutDate})}">운동 상세</a>
            </div>
            <p class="empty" th:if="${#lists.isEmpty(workoutDays)}">운동 기록이 없습니다.</p>
        </div>
    </section>
</main>
</body>
</html>
