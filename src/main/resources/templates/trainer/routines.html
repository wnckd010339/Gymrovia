<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/layouts/trainer.css}"><link rel="stylesheet" th:href="@{/css/layouts/trainer-sidebar.css}"><title>운동 루틴 | Gymrovia</title>
</head>
<body>
<header th:replace="~{trainer/fragments :: sidebar('routines', ${headerProfile})}"></header>
<main class="portal-main">
    <div class="page-heading"><div><p class="eyebrow">WORKOUT ROUTINES</p><h1>운동 루틴</h1><p>회원별 운동 목표와 여러 운동 항목을 관리합니다.</p></div><a class="button" href="/trainer/routines/new">새 루틴 만들기</a></div>
    <section class="card">
        <p class="notice" th:if="${message}" th:text="${message}"></p>
        <div class="toolbar"><form method="get"><select name="memberId"><option value="">전체 회원</option><option th:each="m:${members}" th:value="${m.memberId}" th:selected="${m.memberId==selectedMemberId}" th:text="${m.name}"></option></select><button>조회</button></form></div>
        <table class="data-table"><thead><tr><th>회원</th><th>루틴</th><th>운동 수</th><th>시작일</th><th></th></tr></thead><tbody>
        <tr th:each="r:${routines}"><td th:text="${r.memberName}"></td><td th:text="${r.title}"></td><td th:text="${r.exerciseCount+'종목'}"></td><td th:text="${r.startDate}"></td><td><div class="table-actions"><a class="action-button action-button--secondary" th:href="@{/trainer/routines/{id}/edit(id=${r.routineId})}">수정</a><form class="delete-form" method="post" th:action="@{/trainer/routines/{id}/delete(id=${r.routineId})}" data-confirm="이 운동 루틴을 삭제하시겠습니까?"><button class="action-button danger-button" type="submit">삭제</button></form></div></td></tr>
        <tr th:if="${#lists.isEmpty(routines)}"><td class="empty" colspan="5">등록된 운동 루틴이 없습니다.</td></tr>
        </tbody></table>
    </section>
</main>
</body>
</html>
