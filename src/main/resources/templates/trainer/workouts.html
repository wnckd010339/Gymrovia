<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/layouts/trainer.css}"><link rel="stylesheet" th:href="@{/css/layouts/trainer-sidebar.css}">
    <title>운동 기록 | Gymrovia</title>
</head>
<body>
<header th:replace="~{trainer/fragments :: sidebar('workouts', ${headerProfile})}"></header>
<main class="portal-main">
    <div class="page-heading"><div><p class="eyebrow">WORKOUT LOGS</p><h1>운동 기록</h1><p>담당 회원의 운동 기록을 날짜별로 확인합니다.</p></div><a class="button" href="/trainer/workouts/new">운동 기록 작성</a></div>
    <p class="notice" th:if="${message}" th:text="${message}"></p>
    <section class="card">
        <div class="toolbar"><form method="get"><select name="memberId"><option value="">전체 회원</option><option th:each="m:${members}" th:value="${m.memberId}" th:selected="${m.memberId == selectedMemberId}" th:text="${m.name}"></option></select><button>조회</button></form></div>
        <table class="data-table">
            <thead><tr><th>회원</th><th>날짜</th><th>운동</th><th>종목 / 세트</th><th></th></tr></thead>
            <tbody>
            <tr th:each="day:${workoutDays}">
                <td th:text="${day.memberName}"></td>
                <td th:text="${#temporals.format(day.workoutDate,'yyyy.MM.dd')}"></td>
                <td th:text="${day.workoutSummary}"></td>
                <td th:text="|${day.exerciseCount}종목 / ${day.totalSets}세트|"></td>
                <td><div class="table-actions"><a class="action-button action-button--secondary" th:href="@{/trainer/workouts/{id}/edit(id=${day.firstSessionId})}">수정</a><a class="action-button action-button--primary" th:href="@{/trainer/workouts/daily(memberId=${day.memberId},date=${day.workoutDate})}">상세보기</a></div></td>
            </tr>
            <tr th:if="${#lists.isEmpty(workoutDays)}"><td colspan="5">운동 기록이 없습니다.</td></tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
