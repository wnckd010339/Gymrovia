<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/layouts/trainer.css}">
    <link rel="stylesheet" th:href="@{/css/layouts/trainer-sidebar.css}">
    <title>담당 회원 | Gymrovia</title>
</head>
<body>
<header th:replace="~{trainer/fragments :: sidebar('members', ${headerProfile})}"></header>
<main class="portal-main">
    <div class="page-heading">
        <div>
            <p class="eyebrow">MY MEMBERS</p>
            <h1>담당 회원</h1>
            <p>배정된 회원의 이용 및 운동 현황을 관리합니다.</p>
        </div>
    </div>
    <section class="card">
        <div class="toolbar">
            <form method="get" role="search">
                <label class="sr-only" for="member-keyword">회원 검색</label>
                <input id="member-keyword" name="keyword" th:value="${keyword}"
                       placeholder="이름 또는 연락처 검색">
                <button type="submit">검색</button>
            </form>
        </div>
        <div class="table-scroll">
            <table class="data-table member-table">
                <thead>
                <tr><th>회원</th><th>연락처</th><th>활성 회원권</th><th>최근 출석</th><th>최근 운동</th><th>관리</th></tr>
                </thead>
                <tbody>
                <tr th:each="member:${members}">
                    <td th:text="${member.name}"></td>
                    <td th:text="${member.phone}"></td>
                    <td th:text="${member.activeMembership}"></td>
                    <td th:text="${member.lastAttendanceAt == null ? '-' : #temporals.format(member.lastAttendanceAt,'yyyy.MM.dd')}"></td>
                    <td th:text="${member.lastWorkoutAt == null ? '-' : #temporals.format(member.lastWorkoutAt,'yyyy.MM.dd')}"></td>
                    <td><a class="action-button action-button--primary"
                           th:href="@{/trainer/members/{id}(id=${member.memberId})}">상세정보</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(members)}">
                    <td colspan="6" class="empty">담당 회원이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
