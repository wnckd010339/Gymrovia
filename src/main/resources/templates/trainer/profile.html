<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/layouts/trainer.css}">
    <link rel="stylesheet" th:href="@{/css/layouts/trainer-sidebar.css}">
    <title>내 프로필 | Gymrovia</title>
</head>
<body>
<header th:replace="~{trainer/fragments :: sidebar('profile', ${headerProfile})}"></header>
<main class="portal-main">
    <section class="card form-card">
        <div class="page-heading">
            <div><p class="eyebrow">MY PROFILE</p><h1>내 프로필</h1><p>회원에게 표시되는 기본 정보를 관리합니다.</p></div>
        </div>
        <p class="notice" th:if="${message}" th:text="${message}"></p>
        <form method="post" th:object="${profileForm}">
            <div class="form-grid">
                <div class="field">
                    <label for="trainer-name">이름</label>
                    <input id="trainer-name" autocomplete="name" th:field="*{name}">
                    <p class="field-error" th:errors="*{name}"></p>
                </div>
                <div class="field">
                    <label for="trainer-phone">연락처</label>
                    <input id="trainer-phone" autocomplete="tel" inputmode="tel" th:field="*{phone}">
                    <p class="field-error" th:errors="*{phone}"></p>
                </div>
                <div class="field wide">
                    <label for="trainer-specialty">전문 분야</label>
                    <textarea id="trainer-specialty" th:field="*{specialty}"
                              placeholder="예: 근력 향상, 체형 교정"></textarea>
                </div>
            </div>
            <div class="form-actions"><button type="submit">저장</button></div>
        </form>
    </section>
</main>
</body>
</html>
