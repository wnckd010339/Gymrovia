<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="portal-header" th:fragment="sidebar(active, profile)">
    <a class="brand"
       th:href="@{/trainer/home}">
        <span>F</span>
        FitFlow
    </a>

    <button class="sidebar-toggle"
            type="button"
            aria-controls="trainer-navigation"
            aria-expanded="false"
            aria-label="메뉴 열기">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav id="trainer-navigation"
         aria-label="트레이너 메뉴">
        <a th:href="@{/trainer/home}"
           th:classappend="${active == 'home'} ? 'active'">
            <svg class="trainer-nav-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <path d="m3 11 9-8 9 8"/>
                <path d="M5 10v10h14V10"/>
                <path d="M9 20v-6h6v6"/>
            </svg>
            <span>홈</span>
        </a>

        <a th:href="@{/trainer/members}"
           th:classappend="${active == 'members'} ? 'active'">
            <svg class="trainer-nav-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <circle cx="9" cy="8" r="4"/>
                <path d="M3 21v-2a6 6 0 0 1 12 0v2"/>
                <path d="M16 4.5a4 4 0 0 1 0 7"/>
                <path d="M18 15a5 5 0 0 1 3 4.5V21"/>
            </svg>
            <span>담당 회원</span>
        </a>

        <a th:href="@{/trainer/routines}"
           th:classappend="${active == 'routines'} ? 'active'">
            <svg class="trainer-nav-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <rect x="5" y="3"
                      width="14" height="18" rx="2"/>
                <path d="M9 3.5h6"/>
                <path d="m8 10 1.5 1.5L12 9"/>
                <path d="M14 10h2"/>
                <path d="m8 15 1.5 1.5L12 14"/>
                <path d="M14 15h2"/>
            </svg>
            <span>운동 루틴</span>
        </a>

        <a th:href="@{/trainer/workouts}"
           th:classappend="${active == 'workouts'} ? 'active'">
            <svg class="trainer-nav-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <path d="M3 12h3"/>
                <path d="M18 12h3"/>
                <path d="M6 9v6"/>
                <path d="M18 9v6"/>
                <path d="M9 7v10"/>
                <path d="M15 7v10"/>
                <path d="M9 12h6"/>
            </svg>
            <span>운동 기록</span>
        </a>

        <a th:href="@{/trainer/profile}"
           th:classappend="${active == 'profile'} ? 'active'">
            <svg class="trainer-nav-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21a8 8 0 0 1 16 0"/>
            </svg>
            <span>내 프로필</span>
        </a>
    </nav>
    <div class="portal-profile">
        <span class="avatar" th:text="${#strings.substring(profile.name, 0, 1)}">김</span>
        <div>
            <strong th:text="${profile.name + ' 트레이너'}">트레이너</strong>
            <small th:text="${profile.specialty}">전문 분야</small>
        </div>
        <form th:action="@{/logout}" method="post"><button>로그아웃</button></form>
    </div>
    <script th:src="@{/js/screens/trainer-sidebar.js}"></script>
</header>
</body>
</html>
