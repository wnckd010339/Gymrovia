<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/layouts/trainer.css}"><link rel="stylesheet" th:href="@{/css/layouts/trainer-sidebar.css}"><title>운동 기록 저장 | Gymrovia</title></head><body>
<header th:replace="~{trainer/fragments :: sidebar('workouts', ${headerProfile})}"></header>
<main class="portal-main"><a class="back-link" href="/trainer/workouts">← 운동 기록</a>
<form class="workout-editor" th:action="${sessionId==null?'/trainer/workouts':'/trainer/workouts/'+sessionId}" method="post" th:object="${workoutForm}">
<p class="form-error" th:if="${#fields.hasGlobalErrors()}" th:each="error:${#fields.globalErrors()}" th:text="${error}"></p>
<section class="card form-card"><div class="page-heading"><div><p class="eyebrow">WORKOUT LOG</p><h1 th:text="${sessionId==null?'새 운동 기록':'운동 기록 수정'}"></h1><p>기본 정보를 입력하고 그날 진행한 운동을 모두 추가하세요.</p></div></div><div class="form-grid">
<div class="field"><label>회원</label><select th:field="*{memberId}"><option value="">회원 선택</option><option th:each="m:${members}" th:value="${m.memberId}" th:text="${m.name}"></option></select><p class="field-error" th:errors="*{memberId}"></p></div>
<div class="field"><label>루틴 (선택)</label><select th:field="*{routineId}"><option value="">개인 운동</option><option th:each="routine:${routines}" th:value="${routine.routineId}" th:attr="data-member-id=${routine.memberId}" th:text="${routine.memberName + ' · ' + routine.title}"></option></select></div>
<div class="field"><label>운동 시간(분)</label><input type="number" min="1" max="1440" th:field="*{durationMinutes}"><p class="field-error" th:errors="*{durationMinutes}"></p></div>
<div class="field wide"><label>전체 메모</label><textarea th:field="*{memo}" placeholder="그날의 컨디션이나 코칭 메모"></textarea></div></div></section>
<section class="card"><div class="exercise-section-heading"><div><p class="eyebrow">EXERCISES</p><h2>운동 항목</h2><p>루틴 작성과 같은 방식으로 여러 운동을 한 번에 기록합니다.</p></div><button class="button secondary" id="add-workout-exercise" type="button">+ 운동 추가</button></div>
<div class="workout-exercise-list" id="workout-exercise-list"><article class="workout-exercise-card" th:each="exercise,stat:*{exercises}"><div class="workout-exercise-title"><strong th:text="${stat.index+1}">1</strong><button class="remove-workout-exercise" type="button">삭제</button></div><div class="workout-exercise-grid">
<div class="field"><label>운동 종목</label><input th:field="*{exercises[__${stat.index}__].exerciseName}" placeholder="예: 백 스쿼트"><p class="field-error" th:errors="*{exercises[__${stat.index}__].exerciseName}"></p></div>
<div class="field"><label>세트</label><input type="number" min="1" max="20" th:field="*{exercises[__${stat.index}__].sets}"><p class="field-error" th:errors="*{exercises[__${stat.index}__].sets}"></p></div>
<div class="field"><label>중량(kg)</label><input type="number" min="0" step="0.5" th:field="*{exercises[__${stat.index}__].weight}"><p class="field-error" th:errors="*{exercises[__${stat.index}__].weight}"></p></div>
<div class="field"><label>반복 횟수</label><input type="number" min="0" max="1000" th:field="*{exercises[__${stat.index}__].reps}"><p class="field-error" th:errors="*{exercises[__${stat.index}__].reps}"></p></div>
</div></article></div><div class="form-actions"><a class="button secondary" href="/trainer/workouts">취소</a><button type="submit">저장</button></div></section></form>
<template id="workout-exercise-template"><article class="workout-exercise-card"><div class="workout-exercise-title"><strong>1</strong><button class="remove-workout-exercise" type="button">삭제</button></div><div class="workout-exercise-grid"><div class="field"><label>운동 종목</label><input name="exercises[__INDEX__].exerciseName" placeholder="예: 백 스쿼트"></div><div class="field"><label>세트</label><input type="number" min="1" max="20" name="exercises[__INDEX__].sets" value="3"></div><div class="field"><label>중량(kg)</label><input type="number" min="0" step="0.5" name="exercises[__INDEX__].weight"></div><div class="field"><label>반복 횟수</label><input type="number" min="0" max="1000" name="exercises[__INDEX__].reps"></div></div></article></template>
</main><script th:src="@{/js/screens/trainer-workout-form.js}"></script></body></html>
