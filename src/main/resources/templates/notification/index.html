<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>알림 | FitFlow</title>
    <link rel="stylesheet" th:if="${!adminView}" th:href="@{/css/layouts/member.css}">
    <link rel="stylesheet" th:if="${adminView}" th:href="@{/css/layouts/admin.css}">
    <link rel="stylesheet" th:href="@{/css/pages/notifications.css}">
</head>
<body th:classappend="${adminView} ? 'admin-layout'">
<th:block th:if="${!adminView}">
    <header th:replace="~{member/portal-fragments :: header('notifications')}"></header>
</th:block>
<th:block th:if="${adminView}">
    <aside th:replace="~{fragments/layout :: adminSidebar('notifications')}"></aside>
</th:block>
<main th:class="${adminView} ? 'admin-main notification-page' : 'portal-main notification-page'">
    <div class="notification-title">
        <div><p class="eyebrow">NOTIFICATIONS</p><h1>알림 센터</h1><p>회원권 만료와 주요 운영 소식을 한곳에서 확인합니다.</p></div>
        <form th:if="${notificationHeader != null and notificationHeader.unreadCount > 0}"
              th:action="${adminView} ? @{/admin/notifications/read-all} : @{/member/notifications/read-all}" method="post">
            <button type="submit">모두 읽음</button>
        </form>
    </div>
    <nav class="notification-filter">
        <a th:classappend="${!unreadOnly} ? 'active'" th:href="${adminView} ? @{/admin/notifications} : @{/member/notifications}">전체</a>
        <a th:classappend="${unreadOnly} ? 'active'" th:href="${adminView} ? @{/admin/notifications(unreadOnly=true)} : @{/member/notifications(unreadOnly=true)}">읽지 않음</a>
    </nav>
    <section class="notification-list">
        <article th:each="item : ${notifications}" th:classappend="${item.unread()} ? 'unread'">
            <span class="notification-icon">🔔</span>
            <div><div class="notification-item-heading"><strong th:text="${item.title}">알림 제목</strong><em th:if="${item.unread()}">NEW</em></div>
                <p th:text="${item.message}">알림 내용</p>
                <time th:text="${#temporals.format(item.createdAt, 'yyyy.MM.dd HH:mm')}">2026.08.26 10:00</time>
            </div>
            <form th:action="${adminView} ? @{/admin/notifications/{id}/read(id=${item.id})} : @{/member/notifications/{id}/read(id=${item.id})}" method="post">
                <input type="hidden" name="target" th:value="${item.targetUrl}">
                <button type="submit" th:text="${item.targetUrl != null ? '확인하기' : '읽음'}">확인하기</button>
            </form>
        </article>
        <div class="notification-empty-state" th:if="${#lists.isEmpty(notifications)}"><span>✓</span><strong>확인할 알림이 없습니다.</strong><p>새로운 소식이 생기면 여기에 표시됩니다.</p></div>
    </section>
</main>
</body>
</html>
