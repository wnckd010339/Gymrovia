<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <meta name="referrer"
          content="no-referrer">

    <title>QR 출석 처리 | FitFlow</title>

    <link rel="stylesheet"
          th:href="@{/css/layouts/member.css}"
          href="/css/layouts/member.css">

    <link rel="stylesheet"
          th:href="@{/css/pages/member/attendance-qr.css}"
          href="/css/pages/member/attendance-qr.css">
</head>
<body>

<header th:replace="~{member/portal-fragments :: header('attendance')}">
</header>

<main class="portal-main qr-attendance-page">
    <p class="eyebrow">QR ATTENDANCE</p>
    <h1>QR 출석</h1>

    <p class="subtitle">
        센터 QR을 확인했습니다.
        출석을 처리하고 있습니다.
    </p>

    <section
            id="qr-verification"
            class="qr-verification-card"
            th:attr="data-action=${attendanceAction}">

        <div class="verification-icon"
             aria-hidden="true">
            ✓
        </div>

        <p class="verification-label">
            센터 인증 완료
        </p>

        <div th:if="${attendanceAction == 'CHECK_IN'}">
            <h2>체크인 처리 중</h2>
            <p class="verification-description">
                입실 시간을 기록하고 있습니다.
            </p>

            <form
                    id="qr-attendance-form"
                    th:action="@{/member/attendance/qr/check-in}"
                    method="post">

                <input
                        type="hidden"
                        name="verificationToken"
                        th:value="${verificationToken}">
            </form>
        </div>

        <div th:if="${attendanceAction == 'CHECK_OUT'}">
            <h2>체크아웃 처리 중</h2>
            <p class="verification-description">
                퇴실 시간을 기록하고 있습니다.
            </p>

            <form
                    id="qr-attendance-form"
                    th:action="@{/member/attendance/qr/check-out}"
                    method="post">

                <input
                        type="hidden"
                        name="verificationToken"
                        th:value="${verificationToken}">
            </form>
        </div>

        <div class="qr-processing-indicator"
             aria-live="polite">
            <span class="qr-processing-spinner"
                  aria-hidden="true"></span>
            <strong>잠시만 기다려 주세요.</strong>
        </div>

        <noscript>
            <p class="verification-expired-message">
                자동 출석 처리를 위해 JavaScript가 필요합니다.
            </p>
        </noscript>
    </section>

    <section class="portal-card qr-guide-card">
        <h2>처리 안내</h2>

        <ul>
            <li>QR 인증은 한 번만 사용할 수 있습니다.</li>
            <li>처리가 끝나면 출석 이력 화면으로 이동합니다.</li>
            <li>오류가 발생하면 센터 QR을 다시 촬영해 주세요.</li>
        </ul>
    </section>
</main>

<script
        defer
        th:src="@{/js/screens/member-attendance-qr.js}"
        src="/js/screens/member-attendance-qr.js">
</script>

</body>
</html>
