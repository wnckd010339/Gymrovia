<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>출석 | FitFlow</title>
    <link rel="stylesheet" th:href="@{/css/layouts/member.css}">
</head>
<body>
    <header th:replace="~{member/portal-fragments :: header('attendance')}">
    </header>
    <main class="portal-main">
        <p class="eyebrow">ATTENDANCE</p>
        <h1>출석</h1>
        <p class="subtitle">버튼 또는 센터 QR 인증으로 입실·퇴실을 기록합니다.</p>
        <p class="notice" th:if="${message}" th:text="${message}"></p>
        <p class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <section class="attendance-hero">
        <div th:if="${#lists.isEmpty(attendances) or attendances[0].attendanceDate != #temporals.createToday()}">
                <h2>오늘 아직 입실하지 않았어요</h2>
                <p>활성 회원권이 확인되면 체크인할 수 있습니다.</p>
                <form th:action="@{/member/attendance/check-in}" method="post">
                    <input type="hidden" name="redirect" value="/member/attendance">
                    <button>체크인하기</button></form></div><div th:if="${!#lists.isEmpty(attendances) and attendances[0].attendanceDate == #temporals.createToday() and attendances[0].checkedOutAt == null}">
            <h2 th:text="|${#temporals.format(attendances[0].checkedInAt, 'HH:mm')}에 체크인했어요|">체크인</h2>
            <p>운동이 끝나면 체크아웃해 주세요.</p>

            <form th:action="@{/member/attendance/check-out}" method="post">
                <input type="hidden" name="redirect" value="/member/attendance">
                <button>체크아웃하기</button>
            </form>
        </div>

        <div th:if="${!#lists.isEmpty(attendances) and attendances[0].attendanceDate == #temporals.createToday() and attendances[0].checkedOutAt != null}">
            <h2>오늘 출석을 완료했어요</h2>
            <p th:text="|${#temporals.format(attendances[0].checkedInAt, 'HH:mm')} 입실 · ${#temporals.format(attendances[0].checkedOutAt, 'HH:mm')} 퇴실|">완료</p>
        </div>
    </section>
    <section class="portal-card">
        <h2>출석 이력</h2>
        <table>
            <thead>
            <tr><th>날짜</th>
                <th>입실</th><th>퇴실</th>
                <th>상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="attendance : ${attendances}">
                <td th:text="${#temporals.format(attendance.attendanceDate, 'yyyy.MM.dd')}">날짜</td>
                <td th:text="${#temporals.format(attendance.checkedInAt, 'HH:mm')}">입실</td>
                <td th:text="${attendance.checkedOutAt == null ? '-' : #temporals.format(attendance.checkedOutAt, 'HH:mm')}">퇴실</td>
                <td th:text="${attendance.checkedOutAt == null ? '입실 중' : '완료'}">상태</td>
            </tr>
            <tr th:if="${#lists.isEmpty(attendances)}">
                <td colspan="4">출석 이력이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </section>
    </main>
</body>
</html>
