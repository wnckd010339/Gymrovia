<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 정보 | Gymrovia</title><link rel="stylesheet" th:href="@{/css/layouts/member.css}"><link rel="stylesheet" th:href="@{/css/pages/member/profile.css}"><link rel="stylesheet" th:href="@{/css/pages/member/profile-account.css}"></head><body>
<header th:replace="~{member/portal-fragments :: header('profile')}"></header><main class="portal-main"><p class="eyebrow">MY PROFILE</p><h1>내 정보</h1><p class="subtitle">개인정보와 계정 정보를 안전하게 관리하세요.</p><p class="notice" th:if="${message}" th:text="${message}"></p><p class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
<div class="profile-layout"><aside class="profile-summary"><div class="profile-avatar" th:text="${#strings.substring(profile.name,0,1)}">김</div><h2 th:text="${profile.name}">김지훈</h2><p th:text="|${profile.loginId} · MEMBER|">member01 · MEMBER</p><span class="profile-status">계정 활성</span><dl><div><dt>회원권</dt><dd th:text="${profile.remainingDays==null?'-':'D-'+profile.remainingDays}">D-12</dd></div><div><dt>이번 달 출석</dt><dd th:text="|${profile.monthlyAttendanceCount}회|">14회</dd></div><div><dt>PT 잔여</dt><dd th:text="|${profile.remainingPtSessions}회|">5회</dd></div></dl><form th:action="@{/logout}" method="post"><button class="profile-logout">로그아웃</button></form></aside>
<section class="profile-content"><form class="profile-form portal-card" th:action="@{/member/profile}" th:object="${memberProfileForm}" method="post"><h2>개인 정보</h2><div class="profile-fields"><label>이름<input th:field="*{name}"></label><label>생년월일<input th:field="*{birthDate}" type="date"></label><label>연락처<input th:field="*{phone}"></label><label>이메일<input th:field="*{email}" type="email"></label><label>성별<select th:field="*{gender}"><option value="">선택 안 함</option><option value="MALE">남성</option><option value="FEMALE">여성</option></select></label><label>로그인 ID<input th:value="${profile.loginId}" disabled></label></div><div class="profile-errors"><p th:each="error:${#fields.errors('*')}" th:text="${error}"></p></div><button class="profile-save">변경 저장</button></form>
<form class="portal-card password-form" th:action="@{/member/profile/password}" th:object="${passwordChangeForm}" method="post"><h2>비밀번호 변경</h2><p>현재 비밀번호를 확인한 뒤 8자 이상의 새 비밀번호로 변경합니다.</p><label>현재 비밀번호<input type="password" th:field="*{currentPassword}" autocomplete="current-password" required></label><label>새 비밀번호<input type="password" th:field="*{newPassword}" autocomplete="new-password" minlength="8" maxlength="72" required></label><label>새 비밀번호 확인<input type="password" th:field="*{newPasswordConfirmation}" autocomplete="new-password" minlength="8" maxlength="72" required></label><button class="profile-save">비밀번호 변경</button></form>
<section class="portal-card account-guide"><h2>알림 안내</h2><div><strong>회원권 만료 알림</strong><span>알림은 추후 확장 기능으로 제공됩니다.</span></div></section></section></div></main></body></html>
