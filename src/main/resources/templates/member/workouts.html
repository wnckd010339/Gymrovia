<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>운동 | Gymrovia</title><link rel="stylesheet" th:href="@{/css/layouts/member.css}"><link rel="stylesheet" th:href="@{/css/pages/member/workouts.css}"></head><body>
<header th:replace="~{member/portal-fragments :: header('workouts')}"></header><main class="portal-main"><p class="eyebrow">WORKOUT</p><h1>운동 루틴과 기록</h1><p class="subtitle">오늘 진행한 여러 운동을 한 번에 기록하고 날짜별로 확인하세요.</p>
<section class="portal-card"><h2>활성 운동 루틴</h2><div th:if="${!#lists.isEmpty(routine)}"><h3 th:text="${routine[0].title}"></h3><p th:text="${routine[0].description}"></p><ul class="exercise-list"><li th:each="exercise:${routine}"><strong th:text="${exercise.exerciseName}"></strong><span th:text="|${exercise.targetSets}세트 · ${exercise.targetRepsMin?:'-'}~${exercise.targetRepsMax?:'-'}회|"></span></li></ul></div><p class="empty" th:if="${#lists.isEmpty(routine)}">현재 활성 운동 루틴이 없습니다.</p></section>
<form class="portal-card member-workout-editor" th:action="@{/member/workouts}" th:object="${workoutRecordForm}" method="post"><div class="section-heading"><div><h2>운동 기록 작성</h2><p>기본 정보를 한 번 입력하고 운동 항목을 추가하세요.</p></div><button class="secondary-action" id="add-member-exercise" type="button">+ 운동 추가</button></div><input type="hidden" th:field="*{routineId}"><div class="base-fields"><label>운동 시간(분)<input type="number" min="1" max="1440" th:field="*{durationMinutes}"><small class="field-error" th:errors="*{durationMinutes}"></small></label><label>전체 메모<textarea rows="2" th:field="*{memo}"></textarea></label></div><p class="field-error" th:errors="*{exercises}"></p><div class="member-exercise-list" id="member-exercise-list"><article class="member-exercise-card" th:each="exercise,stat:*{exercises}"><div class="exercise-card-heading"><strong th:text="|운동 ${stat.index+1}|"></strong><button class="remove-member-exercise" type="button">삭제</button></div><div class="exercise-fields"><label>운동 종목<input th:field="*{exercises[__${stat.index}__].exerciseName}"><small class="field-error" th:errors="*{exercises[__${stat.index}__].exerciseName}"></small></label><label>세트<input type="number" min="1" max="20" th:field="*{exercises[__${stat.index}__].sets}"><small class="field-error" th:errors="*{exercises[__${stat.index}__].sets}"></small></label><label>중량(kg)<input type="number" min="0" step="0.5" th:field="*{exercises[__${stat.index}__].weight}"><small class="field-error" th:errors="*{exercises[__${stat.index}__].weight}"></small></label><label>반복 횟수<input type="number" min="0" max="1000" th:field="*{exercises[__${stat.index}__].reps}"><small class="field-error" th:errors="*{exercises[__${stat.index}__].reps}"></small></label></div></article></div><div class="editor-actions"><button type="submit">기록 저장</button></div></form>
<section class="portal-card"><h2>최근 운동 기록</h2><p class="notice" th:if="${message}" th:text="${message}"></p><table><thead><tr><th>날짜</th><th>운동</th><th>종목</th><th>세트</th><th></th></tr></thead><tbody><tr th:each="day:${workoutDays}"><td th:text="${#temporals.format(day.workoutDate,'yyyy.MM.dd')}"></td><td th:text="${day.workoutSummary}"></td><td th:text="|${day.exerciseCount}종목|"></td><td th:text="|${day.totalSets}세트|"></td><td><div class="row-actions"><a class="secondary-action" th:href="@{/member/workouts/{id}/edit(id=${day.firstSessionId})}">수정</a><a class="primary-action" th:href="@{/member/workouts/daily(date=${day.workoutDate})}">상세보기</a></div></td></tr><tr th:if="${#lists.isEmpty(workoutDays)}"><td colspan="5">저장된 운동 기록이 없습니다.</td></tr></tbody></table></section>
<template id="member-exercise-template"><article class="member-exercise-card"><div class="exercise-card-heading"><strong>운동</strong><button class="remove-member-exercise" type="button">삭제</button></div><div class="exercise-fields"><label>운동 종목<input name="exercises[__INDEX__].exerciseName"></label><label>세트<input type="number" min="1" max="20" name="exercises[__INDEX__].sets" value="3"></label><label>중량(kg)<input type="number" min="0" step="0.5" name="exercises[__INDEX__].weight"></label><label>반복 횟수<input type="number" min="0" max="1000" name="exercises[__INDEX__].reps"></label></div></article></template>
</main><script th:src="@{/js/screens/member-workout-form.js}"></script></body></html>
