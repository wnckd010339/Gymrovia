<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>결제 내역 | Gymrovia</title>
    <link rel="stylesheet" th:href="@{/css/layouts/member.css}">
    <link rel="stylesheet" th:href="@{/css/pages/member/history.css}">
</head>
<body>
<header th:replace="~{member/portal-fragments :: header('payments')}"></header>
<main class="portal-main"><p class="eyebrow">PAYMENTS</p>
    <h1>결제 내역</h1>
    <p class="subtitle">회원권과 PT 상품의 결제·환불 내역입니다.</p>
    <section class="portal-card history-card">
        <div class="history-table">
            <table>
                <thead>
                <tr>
                    <th>일시</th>
                    <th>구분</th>
                    <th>상품</th>
                    <th>결제 수단</th>
                    <th>금액</th>
                    <th>상태</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="payment : ${payments}">
                    <td data-label="일시" th:text="${#temporals.format(payment.occurredAt, 'yyyy.MM.dd HH:mm')}">일시</td>
                    <td data-label="구분"><span class="history-type"
                                              th:classappend="${payment.transactionType == 'REFUND'} ? ' refund'"
                                              th:text="${payment.transactionType == 'REFUND' ? '환불' : '결제'}">결제</span>
                    </td>
                    <td data-label="상품" th:text="${payment.productName ?: '회원권'}">상품</td>
                    <td data-label="결제 수단" th:switch="${payment.paymentMethod}">
                        <span th:case="'CARD'">카드</span>
                        <span th:case="'CASH'">현금</span>
                        <span th:case="'TRANSFER'">계좌이체</span>
                        <span th:case="'EASY_PAY'">간편결제</span>
                        <span th:case="*" th:text="${payment.paymentMethod ?: '-'}"></span>
                    </td>
                    <td data-label="금액" th:classappend="${payment.transactionType == 'REFUND'} ? ' refund-amount'"
                        th:text="|${payment.transactionType == 'REFUND' ? '-' : ''}₩${#numbers.formatInteger(payment.amount, 0, 'COMMA')}|">
                        ₩0
                    </td>
                    <td data-label="상태" th:switch="${payment.status}"><span class="history-status"
                                                                            th:case="'COMPLETED'">완료</span><span
                            class="history-status partial" th:case="'PARTIALLY_REFUNDED'">부분 환불</span><span
                            class="history-status neutral" th:case="'REFUNDED'">전액 환불</span><span
                            class="history-status neutral" th:case="*" th:text="${payment.status}">상태</span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(payments)}">
                    <td colspan="6" class="history-empty">결제 내역이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
