<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>운동 기록 수정 | Gymrovia</title><link rel="stylesheet" th:href="@{/css/layouts/member.css}"><link rel="stylesheet" th:href="@{/css/pages/member/workouts.css}"></head><body><header th:replace="~{member/portal-fragments :: header('workouts')}"></header><main class="portal-main"><a class="back-link" th:href="@{/member/workouts}">← 운동 기록</a><form class="portal-card member-workout-editor" th:action="@{/member/workouts/{id}(id=${sessionId})}" th:object="${workoutRecordForm}" method="post"><div class="section-heading"><div><p class="eyebrow">WORKOUT EDIT</p><h1>운동 기록 수정</h1></div><button class="secondary-action" id="add-member-exercise" type="button">+ 운동 추가</button></div><input type="hidden" th:field="*{routineId}"><div class="base-fields"><label>운동 시간(분)<input type="number" min="1" max="1440" th:field="*{durationMinutes}"><small class="field-error" th:errors="*{durationMinutes}"></small></label><label>전체 메모<textarea rows="2" th:field="*{memo}"></textarea></label></div><div class="member-exercise-list" id="member-exercise-list"><article class="member-exercise-card" th:each="exercise,stat:*{exercises}"><div class="exercise-card-heading"><strong th:text="|운동 ${stat.index+1}|"></strong><button class="remove-member-exercise" type="button">삭제</button></div><div class="exercise-fields"><label>운동 종목<input th:field="*{exercises[__${stat.index}__].exerciseName}"><small class="field-error" th:errors="*{exercises[__${stat.index}__].exerciseName}"></small></label><label>세트<input type="number" min="1" max="20" th:field="*{exercises[__${stat.index}__].sets}"></label><label>중량(kg)<input type="number" min="0" step="0.5" th:field="*{exercises[__${stat.index}__].weight}"></label><label>반복 횟수<input type="number" min="0" max="1000" th:field="*{exercises[__${stat.index}__].reps}"></label></div></article></div><div class="editor-actions"><a class="secondary-action" th:href="@{/member/workouts}">취소</a><button type="submit">수정 저장</button></div></form><template id="member-exercise-template"><article class="member-exercise-card"><div class="exercise-card-heading"><strong>운동</strong><button class="remove-member-exercise" type="button">삭제</button></div><div class="exercise-fields"><label>운동 종목<input name="exercises[__INDEX__].exerciseName"></label><label>세트<input type="number" min="1" max="20" name="exercises[__INDEX__].sets" value="3"></label><label>중량(kg)<input type="number" min="0" step="0.5" name="exercises[__INDEX__].weight"></label><label>반복 횟수<input type="number" min="0" max="1000" name="exercises[__INDEX__].reps"></label></div></article></template></main><script th:src="@{/js/screens/member-workout-form.js}"></script></body></html>
