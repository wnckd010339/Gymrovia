<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>운동 상세 | Gymrovia</title><link rel="stylesheet" th:href="@{/css/layouts/member.css}"><link rel="stylesheet" th:href="@{/css/pages/member/workouts.css}"></head><body>
<header th:replace="~{member/portal-fragments :: header('workouts')}"></header><main class="portal-main"><a class="back-link" th:href="@{/member/workouts}">← 운동 기록</a><div class="detail-heading"><div><p class="eyebrow">DAILY WORKOUT</p><h1 th:text="${#temporals.format(workoutDate,'yyyy.MM.dd')+' 운동 기록'}"></h1><p class="subtitle" th:text="|${exerciseCount}종목 · 총 ${totalSets}세트|"></p></div><form method="post" th:action="@{/member/workouts/daily/delete(date=${workoutDate})}" data-confirm="이 날짜의 운동 기록을 모두 삭제하시겠습니까?"><button class="danger-action" type="submit">이 날짜 기록 삭제</button></form></div>
<section class="daily-list"><article class="daily-card" th:each="workout,stat:${workouts}"><span class="daily-number" th:text="${stat.index+1}"></span><div><h2 th:text="${workout.exerciseName}"></h2><p><span th:text="|${workout.sets}세트|"></span><span th:text="${workout.weight==null?'-':workout.weight+'kg'}"></span><span th:text="${workout.reps==null?'-':workout.reps+'회'}"></span><span th:text="${#temporals.format(workout.startedAt,'HH:mm')}"></span></p><small th:if="${workout.memo!=null}" th:text="${workout.memo}"></small></div><div class="daily-actions"><a class="secondary-action" th:href="@{/member/workouts/{id}/edit(id=${workout.sessionId})}">수정</a><form th:if="${stat.index == 0 or workouts[stat.index - 1].sessionId != workout.sessionId}" method="post" th:action="@{/member/workouts/{id}/delete(id=${workout.sessionId})}" data-confirm="이 운동 기록을 삭제하시겠습니까?"><button class="danger-action" type="submit">삭제</button></form></div></article></section></main><script th:src="@{/js/screens/member-workout-form.js}"></script></body></html>
