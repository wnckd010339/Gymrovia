spring.application.name=gym-management

# 프로젝트 루트의 .env 파일을 로컬 설정 파일로 불러옴
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
server.servlet.session.persistent=false
server.tomcat.basedir=${TOMCAT_BASEDIR:.tomcat}

payment.order.expiration-enabled=true
payment.order.expiration-delay-ms=60000

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

# QR 출석
attendance.qr.center-code=${ATTENDANCE_QR_CENTER_CODE:FITFLOW_MAIN}
attendance.qr.center-name=${ATTENDANCE_QR_CENTER_NAME:\uD54F\uD50C\uB85C\uC6B0 \uAC15\uB0A8\uC13C\uD130}
attendance.qr.public-base-url=${ATTENDANCE_QR_PUBLIC_BASE_URL:http://localhost:8080}
attendance.qr.cleanup-enabled=${ATTENDANCE_QR_CLEANUP_ENABLED:true}
attendance.qr.cleanup-delay-ms=${ATTENDANCE_QR_CLEANUP_DELAY_MS:60000}

# Toss Payments
payment.toss.client-key=${TOSS_CLIENT_KEY:}
payment.toss.secret-key=${TOSS_SECRET_KEY:}
payment.toss.base-url=${TOSS_BASE_URL:https://api.tosspayments.com}
payment.toss.success-url=${TOSS_SUCCESS_URL:http://localhost:8080/member/payments/success}
payment.toss.fail-url=${TOSS_FAIL_URL:http://localhost:8080/member/payments/fail}