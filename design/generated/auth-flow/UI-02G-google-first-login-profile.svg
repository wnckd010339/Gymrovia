<text x="720" y="318" font-family="Pretendard, Inter, Arial, sans-serif" font-size="25" font-weight="900" fill="#17332C" text-anchor="middle">Google 인증이 완료됐어요</text><text x="720" y="350" font-family="Pretendard, Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#71807B" text-anchor="middle">센터 이용에 필요한 정보만 추가로 입력해 주세요.</text>
