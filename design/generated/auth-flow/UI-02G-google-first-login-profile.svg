<text x="358" y="606" font-family="Pretendard, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#71807B" text-anchor="start">담당 트레이너를 원하시나요?</text>
<rect x="358" y="624" width="340" height="66" rx="16" fill="#DDF7ED" stroke="none"/><text x="382" y="652" font-family="Pretendard, Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#17332C" text-anchor="start">●  상담을 원해요</text><text x="382" y="674" font-family="Pretendard, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#71807B" text-anchor="start">관리자가 확인 후 배정</text>
<rect x="742" y="624" width="340" height="66" rx="16" fill="#FFFFFF" stroke="#DDE6E2"/><text x="766" y="652" font-family="Pretendard, Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#17332C" text-anchor="start">○  혼자 운동할게요</text><text x="766" y="674" font-family="Pretendard, Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#71807B" text-anchor="start">트레이너 없이 이용</text>
<text x="358" y="740" font-family="Pretendard, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#17332C" text-anchor="start">☑ 이용약관 동의     ☑ 개인정보 처리 동의</text>
