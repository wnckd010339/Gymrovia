<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
<title>AUTH-01 공통 로그인</title><rect width="1440" height="1024" fill="#F5F7F5"/>
<rect x="0" y="0" width="650" height="1024" rx="0" fill="#153A34" stroke="none"/><circle cx="72" cy="68" r="25" fill="#D9F36A"/><text x="72" y="76" font-family="Pretendard, Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#153A34" text-anchor="middle">G</text><text x="112" y="77" font-family="Pretendard, Inter, Arial, sans-serif" font-size="29" font-weight="900" fill="#FFFFFF" text-anchor="start">Gymrovia</text>
<text x="72" y="252" font-family="Pretendard, Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="start">내 운동의 흐름을</text><text x="72" y="306" font-family="Pretendard, Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#D9F36A" text-anchor="start">한곳에서 관리하세요.</text>
<text x="72" y="358" font-family="Pretendard, Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#BBD0C8" text-anchor="start">회원은 운동과 출석을, 관리자는 센터 운영을 더 편하게.</text>
<rect x="72" y="450" width="500" height="212" rx="24" fill="#214C44" stroke="none"/><text x="104" y="494" font-family="Pretendard, Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#D9F36A" text-anchor="start">회원 전용 기능</text>
<text x="104" y="542" font-family="Pretendard, Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start">QR 출석  ·  회원권  ·  운동 루틴</text><text x="104" y="584" font-family="Pretendard, Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start">운동 기록  ·  결제 내역  ·  내 정보</text>
<text x="104" y="626" font-family="Pretendard, Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#BBD0C8" text-anchor="start">담당 트레이너는 원하는 회원만 선택할 수 있어요.</text>
<rect x="650" y="0" width="790" height="1024" rx="0" fill="#F5F7F5" stroke="none"/><text x="824" y="178" font-family="Pretendard, Inter, Arial, sans-serif" font-size="32" font-weight="900" fill="#17332C" text-anchor="start">Gymrovia 시작하기</text><text x="824" y="214" font-family="Pretendard, Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#71807B" text-anchor="start">가입한 방식으로 로그인해 주세요.</text>
<text x="824" y="282" font-family="Pretendard, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#71807B" text-anchor="start">로그인 ID</text><rect x="824" y="294" width="440" height="50" rx="13" fill="#FFFFFF" stroke="#DDE6E2"/><text x="840" y="325" font-family="Pretendard, Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#9BA7A3" text-anchor="start"></text><text x="824" y="372" font-family="Pretendard, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#71807B" text-anchor="start">비밀번호</text><rect x="824" y="384" width="440" height="50" rx="13" fill="#FFFFFF" stroke="#DDE6E2"/><text x="840" y="415" font-family="Pretendard, Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#17332C" text-anchor="start">••••••••</text>
<rect x="824" y="464" width="440" height="50" rx="14" fill="#153A34" stroke="none"/><text x="1044" y="495" font-family="Pretendard, Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">로그인</text>
<line x1="824" y1="548" x2="1008" y2="548" stroke="#DDE6E2"/><text x="1044" y="553" font-family="Pretendard, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#71807B" text-anchor="middle">또는</text><line x1="1080" y1="548" x2="1264" y2="548" stroke="#DDE6E2"/>
<rect x="824" y="582" width="440" height="50" rx="14" fill="#FFFFFF" stroke="#DDE6E2"/><circle cx="852" cy="607" r="10" fill="#4285F4"/><text x="1044" y="613" font-family="Pretendard, Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#17332C" text-anchor="middle">Google로 로그인</text>
<text x="1044" y="682" font-family="Pretendard, Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#71807B" text-anchor="middle">아직 회원이 아니신가요?</text><rect x="824" y="710" width="440" height="50" rx="14" fill="#DDF7ED" stroke="none"/><text x="1044" y="741" font-family="Pretendard, Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#17332C" text-anchor="middle">회원가입</text>
<rect x="824" y="794" width="440" height="74" rx="14" fill="#E8F2FF" stroke="none"/><text x="846" y="824" font-family="Pretendard, Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#17332C" text-anchor="start">관리자 계정은 센터에서 발급합니다.</text><text x="846" y="848" font-family="Pretendard, Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#71807B" text-anchor="start">회원은 직접 가입 후 바로 로그인할 수 있어요.</text>
</svg>